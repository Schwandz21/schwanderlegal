name: Apply official SLS branding

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-branding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply branding script
        run: python3 .github/scripts/apply_sls_brand.py
      - name: Validate and publish
        run: |
          test -s assets/sls-wordmark-header.jpg
          test -s assets/favicon-64.jpg
          git diff --check
          grep -q 'class="brand-logo"' index.html
          grep -q '/assets/favicon-64.jpg?v=20260828' index.html
          git config user.name "Schwander Legal Site Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Integrate official SLS website branding"
          git push origin main
