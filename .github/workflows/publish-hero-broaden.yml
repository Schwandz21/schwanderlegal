name: Publish broader SLS hero copy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-hero-broaden.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply four approved hero copy changes
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          replacements = [
            ('Delaware attorney coverage · Residential refinance closings',
             'Delaware attorney coverage · Residential closings'),
            ('Delaware Refinance Closing Coverage for Your Existing Files',
             'Delaware Closing Coverage for Your Existing Files'),
            ('signing services handling prepared Delaware residential refinance\n            transactions.',
             'signing services handling prepared Delaware residential closing\n            transactions.'),
            ('Approximately 600 Delaware residential refinance closings\n                personally conducted.',
             'Approximately 600 Delaware residential closings\n                personally conducted.'),
          ]
          for old, new in replacements:
            count = s.count(old)
            if count != 1:
              raise SystemExit(f'Expected exactly one match, found {count}: {old}')
            s = s.replace(old, new, 1)
          p.write_text(s)

      - name: Validate surgical change
        run: |
          git diff --check
          test "$(git diff --name-only)" = "index.html"
          grep -q 'Delaware attorney coverage · Residential closings' index.html
          grep -q 'Delaware Closing Coverage for Your Existing Files' index.html
          grep -q 'handling prepared Delaware residential closing' index.html
          grep -q 'Approximately 600 Delaware residential closings' index.html
          ! grep -q 'Delaware attorney coverage · Residential refinance closings' index.html

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "Schwander Legal Site Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/publish-hero-broaden.yml
          git commit -m "Broaden SLS hero from refinance to closing coverage"
          git push origin main
