name: Integrate official SLS branding

on:
  push:
    branches:
      - integrate-banner-favicon

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branding branch
        uses: actions/checkout@v4
        with:
          ref: integrate-banner-favicon
          fetch-depth: 0

      - name: Integrate official banner wordmark and favicon
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          canonical = '  <link rel="canonical" href="https://schwanderlegal.com/" />'
          if '/assets/favicon-64.jpg' not in s:
              block = canonical + '\n  <link rel="icon" type="image/jpeg" sizes="64x64" href="/assets/favicon-64.jpg?v=20260828" />\n  <link rel="shortcut icon" href="/assets/favicon-64.jpg?v=20260828" />\n  <link rel="apple-touch-icon" href="/assets/favicon-64.jpg?v=20260828" />'
              if canonical not in s:
                  raise SystemExit('Canonical link not found')
              s = s.replace(canonical, block, 1)

          og_site = '  <meta property="og:site_name" content="Schwander Legal Services, P.A." />'
          if 'property="og:image"' not in s:
              block = og_site + '\n  <meta property="og:image" content="https://schwanderlegal.com/assets/sls-wordmark-header.jpg?v=20260828" />\n  <meta property="og:image:alt" content="Schwander Legal Services, P.A. official wordmark" />'
              if og_site not in s:
                  raise SystemExit('OG marker not found')
              s = s.replace(og_site, block, 1)

          def css_block(text, selector, replacement):
              pattern = rf'^    {re.escape(selector)} \{{.*?^    \}}'
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.M | re.S)
              if count != 1:
                  raise SystemExit(f'CSS block mismatch for {selector}: {count}')
              return text

          s = css_block(s, '.site-header', '''    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: linear-gradient(90deg, #021f43 0%, #06365f 58%, #0a4677 100%);
      border-bottom: 1px solid rgba(198, 160, 81, 0.72);
      box-shadow: 0 8px 28px rgba(2, 31, 67, 0.18);
    }''')

          s = css_block(s, '.nav', '''    .nav {
      max-width: var(--max);
      margin: 0 auto;
      min-height: 102px;
      padding: 9px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
    }''')

          s = css_block(s, '.brand', '''    .brand {
      display: flex;
      align-items: center;
      flex: 0 1 340px;
      min-width: 255px;
    }''')

          marker = '''    .brand small {
      display: block;
      margin-top: -3px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }'''
          if '.brand-logo {' not in s:
              if marker not in s:
                  raise SystemExit('Brand-small marker not found')
              s = s.replace(marker, marker + '''

    .brand-logo {
      display: block;
      width: min(330px, 35vw);
      max-height: 86px;
      height: auto;
      object-fit: contain;
      object-position: left center;
    }''', 1)

          s = css_block(s, '.nav-links', '''    .nav-links {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.92);
      font-weight: 700;
    }''')

          s = css_block(s, '.nav-links a:hover', '''    .nav-links a:hover {
      color: #f5d98c;
    }''')

          old = '''      <a class="brand" href="#top" aria-label="Schwander Legal Services home">
        <span class="brand-mark" aria-hidden="true">S</span>

        <span>
          Schwander Legal Services, P.A.
          <small>Delaware Refinance Closing Coverage</small>
        </span>
      </a>'''
          new = '''      <a class="brand" href="#top" aria-label="Schwander Legal Services, P.A. home">
        <img
          class="brand-logo"
          src="/assets/sls-wordmark-header.jpg?v=20260828"
          alt="Schwander Legal Services, P.A."
          width="560"
          height="161"
          decoding="async"
        />
      </a>'''
          if old not in s:
              raise SystemExit('Legacy header markup not found')
          s = s.replace(old, new, 1)

          mobile = '''      .nav {
        min-height: 68px;
      }'''
          mobile_new = '''      .nav {
        min-height: 76px;
        padding: 7px 14px;
        gap: 12px;
      }

      .brand {
        min-width: 0;
        flex: 1 1 auto;
      }

      .brand-logo {
        width: min(245px, 58vw);
        max-height: 68px;
      }'''
          if mobile not in s:
              raise SystemExit('Mobile nav marker not found')
          s = s.replace(mobile, mobile_new, 1)

          for item in ('/assets/sls-wordmark-header.jpg?v=20260828', '/assets/favicon-64.jpg?v=20260828', 'class="brand-logo"', 'Request Rate Sheet', 'Delaware Refinance Closing Coverage for Your Existing Files'):
              if item not in s:
                  raise SystemExit('Required marker missing: ' + item)
          if '<span class="brand-mark"' in s:
              raise SystemExit('Legacy S tile still present')
          if s.count('mailto:') != 6:
              raise SystemExit('Mailto count changed: ' + str(s.count('mailto:')))

          p.write_text(s)
          PY

      - name: Validate assets and HTML diff
        run: |
          test -s assets/sls-wordmark-header.jpg
          test -s assets/favicon-64.jpg
          file assets/sls-wordmark-header.jpg | grep -q 'JPEG image data'
          file assets/favicon-64.jpg | grep -q 'JPEG image data'
          git diff --check
          grep -q 'class="brand-logo"' index.html
          grep -q '/assets/favicon-64.jpg?v=20260828' index.html

      - name: Commit branded header
        run: |
          git config user.name "Schwander Legal Site Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Integrate official SLS website branding"
          git push origin integrate-banner-favicon
