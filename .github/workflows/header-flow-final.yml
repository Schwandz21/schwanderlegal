name: Apply final flowing SLS header treatment

on:
  push:
    branches: [fix/header-flow-final]
    paths:
      - '.github/workflows/header-flow-final.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/header-flow-final
          fetch-depth: 0

      - name: Integrate official lockup into one continuous Delaware-inspired header/hero field
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          # Preserve the exact official logo asset and substantive page content.
          # The visual fix is deliberately limited to palette, spacing, header, hero flow, and responsive behavior.
          replacements = {
              '      --gold: #c6a051;': '      --gold: #ead788;',
              '      --gold-dark: #8a6e2f;': '      --gold-dark: #8c7132;',
              '      --blue: #35699a;': '      --blue: #0a5574;',
              '      --blue-deep: #275580;': '      --blue-deep: #00415b;',
              '      --blue-light: #3d73a6;': '      --blue-light: #2d6b86;',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected palette source: {old}')
              s = s.replace(old, new, 1)

          old = '''    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: linear-gradient(104deg, #214c75 0%, #2d5f8d 58%, #35699a 100%);
      border-bottom: 1px solid rgba(198, 160, 81, 0.34);
      box-shadow: 0 7px 24px rgba(39, 85, 128, 0.14);
    }

    .nav {
      max-width: var(--max);
      margin: 0 auto;
      min-height: 96px;
      padding: 10px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
    }

    .brand {
      display: flex;
      align-items: center;
      flex: 0 1 340px;
      min-width: 255px;
    }'''
          new = '''    /*
      The official SLS lockup is intentionally left untouched. This treatment
      gives it breathing room and lets its transparent field dissolve into the
      same Delaware-inspired blue used by the hero instead of reading as a
      separate rectangular banner.
    */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      isolation: isolate;
      background:
        radial-gradient(circle at 18% -55%, rgba(234, 215, 136, 0.12), transparent 42%),
        linear-gradient(118deg, #032f45 0%, #00415b 48%, #0a5574 100%);
      border-bottom: 1px solid rgba(234, 215, 136, 0.52);
      box-shadow: 0 10px 30px rgba(1, 41, 58, 0.2);
    }

    .site-header::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: 0.34;
      background:
        linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.035) 38%, transparent 72%),
        radial-gradient(circle at 78% 20%, rgba(255, 255, 255, 0.045), transparent 32%);
    }

    .nav {
      position: relative;
      max-width: 1280px;
      margin: 0 auto;
      min-height: 126px;
      padding: 16px 28px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 42px;
    }

    .nav::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -6px;
      width: 10px;
      height: 10px;
      background: #00415b;
      border: 1px solid rgba(234, 215, 136, 0.9);
      transform: translateX(-50%) rotate(45deg);
      box-shadow: 0 0 0 3px rgba(0, 65, 91, 0.92);
    }

    .brand {
      display: flex;
      align-items: center;
      flex: 1 1 430px;
      min-width: 330px;
      max-width: 460px;
    }'''
          if old not in s:
              raise SystemExit('Current header/nav source block changed; refusing blind replacement.')
          s = s.replace(old, new, 1)

          old = '''    .brand-logo {
      display: block;
      width: min(330px, 35vw);
      max-height: 80px;
      height: auto;
      object-fit: contain;
      object-position: left center;
      filter: drop-shadow(0 3px 6px rgba(19, 43, 67, 0.24));
    }'''
          new = '''    .brand-logo {
      display: block;
      width: min(420px, 38vw);
      max-width: 100%;
      height: auto;
      object-fit: contain;
      object-position: left center;
      filter: drop-shadow(0 5px 10px rgba(1, 32, 46, 0.28));
    }'''
          if old not in s:
              raise SystemExit('Current brand-logo source block changed.')
          s = s.replace(old, new, 1)

          old = '''    .nav-links {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.92);
      font-weight: 700;
      flex: 0 0 auto;
    }'''
          new = '''    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.94);
      font-weight: 760;
      flex: 0 0 auto;
    }'''
          if old not in s:
              raise SystemExit('Current nav-links source block changed.')
          s = s.replace(old, new, 1)

          old = '''    .hero {
      position: relative;
      overflow: hidden;
      color: #ffffff;
      background:
        radial-gradient(
          circle at 82% 10%,
          rgba(198, 160, 81, 0.21),
          transparent 29%
        ),
        linear-gradient(135deg, #275580 0%, #35699a 48%, #3d73a6 100%);
    }'''
          new = '''    .hero {
      position: relative;
      overflow: hidden;
      color: #ffffff;
      background:
        radial-gradient(circle at 80% 8%, rgba(234, 215, 136, 0.16), transparent 30%),
        radial-gradient(circle at 12% 22%, rgba(255, 255, 255, 0.045), transparent 30%),
        linear-gradient(145deg, #00415b 0%, #0a5574 50%, #2d6b86 100%);
    }'''
          if old not in s:
              raise SystemExit('Current hero source block changed.')
          s = s.replace(old, new, 1)

          old = '''    .hero-inner {
      position: relative;
      z-index: 1;
      max-width: var(--max);
      margin: 0 auto;
      padding: 78px 22px 84px;
      display: grid;
      grid-template-columns: 1.17fr 0.83fr;
      gap: 46px;
      align-items: center;
    }'''
          new = '''    .hero-inner {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 72px 28px 90px;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 56px;
      align-items: center;
    }'''
          if old not in s:
              raise SystemExit('Current hero-inner source block changed.')
          s = s.replace(old, new, 1)

          old = '''    .hero-card {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      padding: 29px;
    }'''
          new = '''    .hero-card {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.095), rgba(255, 255, 255, 0.055));
      border: 1px solid rgba(234, 215, 136, 0.32);
      box-shadow: 0 24px 58px rgba(0, 34, 48, 0.2);
      border-radius: var(--radius);
      padding: 31px;
      backdrop-filter: blur(6px);
    }'''
          if old not in s:
              raise SystemExit('Current hero-card source block changed.')
          s = s.replace(old, new, 1)

          old = '''      .nav {
        min-height: 78px;
        padding: 8px 14px;
        gap: 0;
        justify-content: center;
      }

      .brand {
        min-width: 0;
        flex: 1 1 100%;
        justify-content: center;
        overflow: hidden;
      }

      .brand-logo {
        width: min(300px, 82vw);
        max-height: 64px;
        object-position: center;
      }'''
          new = '''      .nav {
        min-height: 92px;
        padding: 10px 16px 9px;
        gap: 0;
        justify-content: center;
      }

      .nav::after {
        width: 8px;
        height: 8px;
        bottom: -5px;
      }

      .brand {
        min-width: 0;
        max-width: none;
        flex: 1 1 100%;
        justify-content: center;
        overflow: visible;
      }

      .brand-logo {
        width: min(326px, 88vw);
        max-width: 100%;
        object-position: center;
      }'''
          if old not in s:
              raise SystemExit('Current mobile header source block changed.')
          s = s.replace(old, new, 1)

          # Cache-bust the same exact logo asset so browsers immediately pick up the intended header presentation.
          s = s.replace('/assets/sls-lockup.png?v=20260829', '/assets/sls-lockup.png?v=20260829b', 1)

          # QA guardrails: no structural or substantive section deletion.
          required = [
              'Delaware Refinance Closing Coverage for Your Existing Files',
              'The backup resource your Delaware team can call.',
              'Attorney support for prepared Delaware refinance files',
              'Built for the companies that refer Delaware refinance files',
              'Attorney Execution Authority',
              'New Castle County',
              'Sussex County',
              'michaelschwander@schwanderlegal.com',
              '/assets/sls-lockup.png?v=20260829b',
              '#00415b',
              '#ead788',
          ]
          for needle in required:
              if needle not in s:
                  raise SystemExit(f'Required content missing after edit: {needle}')

          p.write_text(s)

      - name: Validate
        run: |
          git diff --check
          test "$(git diff --name-only | tr '\n' ' ')" = "index.html "
          grep -q '/assets/sls-lockup.png?v=20260829b' index.html
          grep -q '#00415b' index.html
          grep -q '#ead788' index.html
          grep -q 'Attorney Execution Authority' index.html

      - name: Commit staged design
        run: |
          git config user.name "Schwander Legal Site Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/header-flow-final.yml
          git commit -m "Integrate SLS header into flowing Delaware palette"
          git push origin fix/header-flow-final
