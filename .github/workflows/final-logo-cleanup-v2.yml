name: Final SLS logo cleanup v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-logo-cleanup-v2.yml'

permissions:
  contents: write

jobs:
  clean-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rebuild clean transparent lockup from official source
        run: |
          python -m pip install --quiet pillow numpy
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import numpy as np

          src_path = Path('assets/sls-wordmark-header.jpg')
          out_path = Path('assets/sls-lockup.png')
          img = Image.open(src_path).convert('RGB')
          a = np.asarray(img).astype(np.uint8)

          r = a[:, :, 0].astype(np.int16)
          alpha = np.zeros(r.shape, dtype=np.uint8)
          alpha[r >= 30] = 255
          edge = (r > 10) & (r < 30)
          alpha[edge] = np.clip(((r[edge] - 10) * 255) / 20, 0, 255).astype(np.uint8)
          alpha[alpha < 20] = 0

          rgba = np.dstack([a, alpha])
          out = Image.fromarray(rgba, 'RGBA')
          bbox = out.getbbox()
          if not bbox:
              raise SystemExit('Transparent matte removed all artwork; refusing publish')
          out = out.crop(bbox)
          out.save(out_path, 'PNG', optimize=True)

          chk = np.asarray(out)
          al = chk[:, :, 3]
          partial = ((al > 0) & (al < 255)).mean()
          if partial > 0.15:
              raise SystemExit(f'Too much partial alpha remains: {partial:.3%}')
          if (al == 255).sum() < 1000:
              raise SystemExit('Too little opaque artwork remains; refusing publish')
          print(f'Clean lockup: {out.size[0]}x{out.size[1]}, partial alpha {partial:.2%}')
          PY

      - name: Remove all logo effects and bump cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()

          pat = r'(?ms)^\s{4}\.brand-logo \{.*?^\s{4}\}'
          replacement = '''    .brand-logo {
              display: block;
              width: min(420px, 38vw);
              max-width: 100%;
              height: auto;
              object-fit: contain;
              object-position: left center;
              background: transparent;
              border: 0;
              padding: 0;
              filter: none;
              opacity: 1;
              mix-blend-mode: normal;
              box-shadow: none;
            }'''
          s2, n = re.subn(pat, replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'Expected one .brand-logo rule; found {n}')
          s = s2

          s2, n = re.subn(r'/assets/sls-lockup\.png\?v=[A-Za-z0-9_-]+', '/assets/sls-lockup.png?v=20260829e', s, count=1)
          if n != 1:
              raise SystemExit(f'Expected one lockup URL to cache-bust; found {n}')
          s = s2

          block = re.search(r'(?ms)^\s{4}\.brand-logo \{.*?^\s{4}\}', s).group(0)
          for bad in ['filter: drop-shadow', 'mix-blend-mode: multiply', 'mix-blend-mode: screen']:
              if bad in block:
                  raise SystemExit(f'Logo effect still present: {bad}')

          for required in ['/assets/sls-lockup.png?v=20260829e','filter: none;','opacity: 1;','mix-blend-mode: normal;','box-shadow: none;']:
              if required not in s:
                  raise SystemExit(f'Required final logo condition missing: {required}')
          p.write_text(s)
          PY

      - name: Validate and publish
        run: |
          git diff --check
          test -s assets/sls-lockup.png
          grep -q '/assets/sls-lockup.png?v=20260829e' index.html
          git config user.name "Schwander Legal Site Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add index.html assets/sls-lockup.png
          git rm -f .github/workflows/final-logo-cleanup.yml .github/workflows/final-logo-cleanup-v2.yml
          git commit -m "Remove SLS logo discoloration artifact"
          git push origin main
