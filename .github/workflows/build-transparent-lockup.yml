name: Build transparent SLS header lockup

on:
  push:
    branches: ['fix/transparent-header-lockup']
    paths: ['.github/workflows/build-transparent-lockup.yml']

permissions:
  contents: write

jobs:
  build-lockup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/transparent-header-lockup
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Create transparent lockup and integrate header
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image
          import math, statistics

          src = Image.open('assets/sls-wordmark-header.jpg').convert('RGB')
          w, h = src.size
          px = src.load()

          # Estimate the dark navy JPEG background from outer-border pixels.
          border = []
          for x in range(w):
              border.append(px[x, 0]); border.append(px[x, h-1])
          for y in range(h):
              border.append(px[0, y]); border.append(px[w-1, y])
          bg = tuple(int(statistics.median([p[i] for p in border])) for i in range(3))

          out = Image.new('RGBA', (w, h), (0,0,0,0))
          opx = out.load()
          for y in range(h):
              for x in range(w):
                  r,g,b = px[x,y]
                  d = math.sqrt((r-bg[0])**2 + (g-bg[1])**2 + (b-bg[2])**2)
                  # Suppress JPEG background noise, retain anti-aliased lettering edges.
                  a = int(max(0, min(255, (d - 6.0) * 12.0)))
                  if a < 10:
                      a = 0
                  # Mild edge lift reduces a dark halo on the blue site header.
                  if a and a < 230:
                      lift = (230-a) / 230 * 14
                      r = min(255, int(r + lift))
                      g = min(255, int(g + lift))
                      b = min(255, int(b + lift))
                  opx[x,y] = (r,g,b,a)

          alpha = out.getchannel('A')
          bbox = alpha.getbbox()
          if not bbox:
              raise SystemExit('Transparency extraction failed: empty output')
          # Keep a few pixels of breathing room around the artwork.
          l,t,r,b = bbox
          pad = 4
          bbox = (max(0,l-pad), max(0,t-pad), min(w,r+pad), min(h,b+pad))
          out = out.crop(bbox)
          out.save('assets/sls-lockup.png', optimize=True)

          p = Path('index.html')
          s = p.read_text()
          old = '<img class="brand-logo" src="/assets/sls-wordmark-header.jpg?v=20260828" alt="Schwander Legal Services, P.A." width="560" height="161" decoding="async" />'
          new = '<img class="brand-logo" src="/assets/sls-lockup.png?v=20260829" alt="Schwander Legal Services, P.A." decoding="async" />'
          if old not in s:
              raise SystemExit('Current header image markup not found')
          s = s.replace(old, new, 1)

          s = s.replace(
              'background: linear-gradient(90deg, #021f43 0%, #06365f 58%, #0a4677 100%);',
              'background: linear-gradient(104deg, #214c75 0%, #2d5f8d 58%, #35699a 100%);',
              1
          )
          s = s.replace(
              'box-shadow: 0 7px 24px rgba(2, 31, 67, 0.14);',
              'box-shadow: 0 7px 24px rgba(39, 85, 128, 0.14);',
              1
          )
          s = s.replace(
              '      object-position: left center;\n    }',
              '      object-position: left center;\n      filter: drop-shadow(0 3px 6px rgba(19, 43, 67, 0.24));\n    }',
              1
          )
          p.write_text(s)

      - name: Validate
        run: |
          git diff --check
          test -s assets/sls-lockup.png
          grep -q 'assets/sls-lockup.png' index.html
          ! grep -q 'class="brand-logo" src="/assets/sls-wordmark-header.jpg' index.html
          ! grep -q 'hero-brand-banner' index.html

      - name: Commit integration
        run: |
          git config user.name "Schwander Legal Site Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add index.html assets/sls-lockup.png
          git rm .github/workflows/build-transparent-lockup.yml
          git commit -m "Integrate transparent SLS header lockup"
          git push origin HEAD:fix/transparent-header-lockup
