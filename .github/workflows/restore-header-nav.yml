name: Restore SLS header navigation styling

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-header-nav.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore nav styles and verify clean logo rules
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()

          if re.search(r'(?m)^\s*\.nav-links \{', s):
              print('nav-links rule already present; leaving it intact')
          else:
              brand = re.search(r'(?ms)^\s*\.brand-logo \{.*?^\s*\}', s)
              if not brand:
                  raise SystemExit('brand-logo rule missing')
              nav_css = '''

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.94);
      font-weight: 760;
      flex: 0 0 auto;
    }

    .nav-links a:hover {
      color: #f5d98c;
    }'''
              s = s[:brand.end()] + nav_css + s[brand.end():]

          # Final header acceptance checks.
          required = [
              '/assets/sls-lockup.png?v=20260829e',
              'filter: none;',
              'opacity: 1;',
              'mix-blend-mode: normal;',
              'box-shadow: none;',
              '.nav-links {',
              '.nav-links a:hover {',
              'Request Rate Sheet',
          ]
          for needle in required:
              if needle not in s:
                  raise SystemExit(f'Missing required header condition: {needle}')

          logo = re.search(r'(?ms)^\s*\.brand-logo \{.*?^\s*\}', s).group(0)
          if 'drop-shadow' in logo:
              raise SystemExit('Old logo drop-shadow survived')

          p.write_text(s)
          PY
          git diff --check

      - name: Publish restoration and remove workflow
        run: |
          git config user.name "Schwander Legal Site Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/restore-header-nav.yml
          git commit -m "Restore header navigation after logo cleanup"
          git push origin main
