name: Restore SLS header navigation styling

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-header-nav.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore base nav styles and verify clean logo rules
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()
          brand = re.search(r'(?ms)^\s*\.brand-logo \{.*?^\s*\}', s)
          if not brand:
              raise SystemExit('brand-logo rule missing')
          after = s[brand.end():brand.end()+500]
          if not re.search(r'(?m)^\s*\.nav-links \{', after):
              nav_css = "\n\n    .nav-links {\n      display: flex;\n      align-items: center;\n      gap: 28px;\n      font-size: 14px;\n      color: rgba(255, 255, 255, 0.94);\n      font-weight: 760;\n      flex: 0 0 auto;\n    }\n\n    .nav-links a:hover {\n      color: #f5d98c;\n    }"
              s = s[:brand.end()] + nav_css + s[brand.end():]
          segment = s[brand.end():brand.end()+700]
          required = ['/assets/sls-lockup.png?v=20260829e','filter: none;','opacity: 1;','mix-blend-mode: normal;','box-shadow: none;','Request Rate Sheet']
          for needle in required:
              if needle not in s:
                  raise SystemExit(f'Missing required header condition: {needle}')
          if '.nav-links {' not in segment or '.nav-links a:hover {' not in segment:
              raise SystemExit('Base nav styling was not restored adjacent to brand logo')
          logo = re.search(r'(?ms)^\s*\.brand-logo \{.*?^\s*\}', s).group(0)
          if 'drop-shadow' in logo:
              raise SystemExit('Old logo drop-shadow survived')
          p.write_text(s)
          PY
          git diff --check

      - name: Publish restoration and remove workflow
        run: |
          git config user.name "Schwander Legal Site Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/restore-header-nav.yml
          git commit -m "Restore header navigation after logo cleanup"
          git push origin main
