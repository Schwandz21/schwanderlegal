name: Fix SLS mobile header layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mobile-header-20260829.yml'

permissions:
  contents: write

jobs:
  fix-mobile-header:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Make mobile header a clean centered brand lockup
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          changes = [
            ('''      .nav {\n        min-height: 76px;\n        padding: 7px 14px;\n        gap: 12px;\n      }''',
             '''      .nav {\n        min-height: 78px;\n        padding: 8px 14px;\n        gap: 0;\n        justify-content: center;\n      }'''),
            ('''      .brand {\n        min-width: 0;\n        flex: 1 1 auto;\n      }''',
             '''      .brand {\n        min-width: 0;\n        flex: 1 1 100%;\n        justify-content: center;\n        overflow: hidden;\n      }'''),
            ('''      .brand-logo {\n        width: min(220px, 55vw);\n        max-height: 60px;\n      }''',
             '''      .brand-logo {\n        width: min(300px, 82vw);\n        max-height: 64px;\n        object-position: center;\n      }'''),
            ('''      .nav-links .btn {\n        padding: 10px 13px;\n        font-size: 12px;\n      }''',
             '''      .nav-links {\n        display: none;\n      }'''),
          ]

          for old, new in changes:
            if old not in s:
              raise SystemExit('Expected mobile-header source block not found; refusing partial edit:\n' + old)
            s = s.replace(old, new, 1)

          p.write_text(s)

      - name: Validate
        run: |
          git diff --check
          grep -q 'width: min(300px, 82vw);' index.html
          grep -q 'justify-content: center;' index.html
          grep -A2 '      .nav-links {' index.html | grep -q 'display: none;'
          grep -q 'assets/sls-lockup.png?v=20260829' index.html

      - name: Commit and publish
        run: |
          git config user.name "Schwander Legal Site Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-mobile-header-20260829.yml
          git commit -m "Polish SLS mobile header"
          git push origin main
